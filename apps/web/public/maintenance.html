<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>FOKUS wird aktualisiert</title>
    <style>
      :root {
        --bg: #000;
        --ink: #f5f5f7;
        --ink3: #8e8e93;
        --surface2: #1c1c1f;
        --warn: #ffb340;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fff;
          --ink: #000;
          --ink3: #6e6e73;
          --surface2: #ebebf0;
          --warn: #b25000;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.45 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      main {
        width: min(100% - 40px, 420px);
        display: grid;
        gap: 16px;
      }
      h1 {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -0.8px;
        margin: 0;
      }
      p {
        margin: 0;
        color: var(--ink3);
      }
      .bar {
        height: 4px;
        border-radius: 2px;
        background: var(--surface2);
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 30%;
        background: var(--ink);
        animation: run 1.4s ease-in-out infinite;
      }
      @keyframes run {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(340%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar i {
          animation: none;
          width: 100%;
          opacity: 0.4;
        }
      }
      #step {
        color: var(--ink);
        font-weight: 500;
      }
      .warn {
        color: var(--warn);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kurz Pause</h1>
      <p>FOKUS wird gerade aktualisiert. Deine Daten sind gesichert.</p>
      <div class="bar" aria-hidden="true"><i></i></div>
      <p id="step" role="status" aria-live="polite">Einen Moment …</p>
      <p id="detail"></p>
    </main>
    <script>
      // Fragt den Fortschritt ab und lädt die App, sobald der Vorgang vorbei ist.
      const step = document.getElementById('step');
      const detail = document.getElementById('detail');
      async function poll() {
        try {
          const r = await fetch('/maintenance/status.json', { cache: 'no-store' });
          if (r.ok) {
            const s = await r.json();
            step.textContent = s.step || 'Einen Moment …';
            detail.textContent = s.from && s.to && s.from !== s.to ? s.from + ' → ' + s.to : '';
            if (s.state === 'failed') {
              step.className = 'warn';
              step.textContent =
                'Das hat nicht geklappt. Bitte gib der Person Bescheid, die FOKUS betreibt.';
            }
            if (s.state === 'ok' || s.state === 'rolled-back') {
              // Prüfen, ob die App wieder da ist, dann neu laden.
              const app = await fetch('/', { cache: 'no-store' });
              if (app.ok && !(await app.text()).includes('Kurz Pause')) return location.reload();
            }
          }
        } catch (e) {}
        setTimeout(poll, 2000);
      }
      poll();
    </script>
  </body>
</html>
