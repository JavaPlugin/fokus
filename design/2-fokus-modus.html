<div style="width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(90% 55% at 50% 38%, #10283A 0%, #0A161E 45%, #000000 80%); color: #FFFFFF; font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px 24px 40px">

</div>

<div style="margin-top: 36px; display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 12px 16px">
