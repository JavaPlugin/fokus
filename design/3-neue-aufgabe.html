<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOKUS – Neue Aufgabe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#C7C7CC}
</style>
<style>html{background:#1a1a1a}body>div{margin:24px auto}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; color: #FFFFFF; font-family: Geist, system-ui, sans-serif; position: relative; overflow: hidden; padding-top: 44px">
<div style="height: 800px; box-sizing: border-box; background: #111113; border-radius: 24px 24px 0 0; padding: 0 20px; display: flex; flex-direction: column">

<div style="display: flex; justify-content: space-between; align-items: center; height: 56px">
<a href="1-heute.html" style="font-size: 16px; color: #A1A1A6; text-decoration: none; padding: 10px 0">Abbrechen</a>
<span style="font-size: 16px; font-weight: 600">Neue Aufgabe</span>
<span style="width: 72px"></span>
</div>

<label for="titel" style="margin-top: 8px; font-size: 13px; color: #A1A1A6">Was?</label>
<input id="titel" value="Team-Call" style="margin-top: 6px; height: 48px; border-radius: 14px; border: none; background: #1C1C1F; color: #FFFFFF; font-family: inherit; font-size: 17px; padding: 0 14px">

<div style="margin-top: 18px; font-size: 13px; color: #A1A1A6">Art</div>
<div style="margin-top: 6px; display: flex; gap: 8px">
<button aria-pressed="true" style="height: 36px; border-radius: 18px; border: none; background: #FFFFFF; color: #000000; font-family: inherit; font-size: 14px; font-weight: 500; padding: 0 14px; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #2F8FD6"></span>Arbeit</button>
<button aria-pressed="false" style="height: 36px; border-radius: 18px; border: none; background: #1C1C1F; color: #FFFFFF; font-family: inherit; font-size: 14px; padding: 0 14px; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #30D158"></span>Pause</button>
<button aria-pressed="false" style="height: 36px; border-radius: 18px; border: none; background: #1C1C1F; color: #FFFFFF; font-family: inherit; font-size: 14px; padding: 0 14px; display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #BF5AF2"></span>Social</button>
</div>

<div style="margin-top: 18px; font-size: 13px; color: #A1A1A6">Wie lange?</div>
<div style="margin-top: 6px; display: flex; gap: 8px">
<button aria-pressed="false" style="height: 36px; border-radius: 18px; border: none; background: #1C1C1F; color: #FFFFFF; font-family: inherit; font-size: 14px; padding: 0 12px">15 Min</button>
<button aria-pressed="true" style="height: 36px; border-radius: 18px; border: none; background: #FFFFFF; color: #000000; font-family: inherit; font-size: 14px; font-weight: 500; padding: 0 12px">30 Min</button>
<button aria-pressed="false" style="height: 36px; border-radius: 18px; border: none; background: #1C1C1F; color: #FFFFFF; font-family: inherit; font-size: 14px; padding: 0 12px">1 Std</button>
<button aria-pressed="false" style="height: 36px; border-radius: 18px; border: none; background: #1C1C1F; color: #FFFFFF; font-family: inherit; font-size: 14px; padding: 0 12px">2 Std</button>
<button aria-pressed="false" style="height: 36px; border-radius: 18px; border: none; background: #1C1C1F; color: #FFFFFF; font-family: inherit; font-size: 14px; padding: 0 12px">…</button>
</div>

<div style="margin-top: 18px; font-size: 13px; color: #A1A1A6">Wann?</div>
<div role="radiogroup" style="margin-top: 6px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #1C1C1F; border-radius: 14px; padding: 4px">
<button role="radio" aria-checked="false" style="height: 36px; border: none; border-radius: 10px; background: none; color: #A1A1A6; font-family: inherit; font-size: 14px">Automatisch</button>
<button role="radio" aria-checked="true" style="height: 36px; border: none; border-radius: 10px; background: #3A3A3C; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 500">Feste Zeit</button>
<button role="radio" aria-checked="false" style="height: 36px; border: none; border-radius: 10px; background: none; color: #A1A1A6; font-family: inherit; font-size: 14px">Später</button>
</div>
<div style="margin-top: 8px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button style="height: 44px; border-radius: 14px; border: none; background: #1C1C1F; color: #FFFFFF; font-family: inherit; font-size: 15px; display: flex; justify-content: space-between; align-items: center; padding: 0 14px"><span style="color: #A1A1A6">Tag</span>Mo, 12. Okt</button>
<button style="height: 44px; border-radius: 14px; border: none; background: #1C1C1F; color: #FFFFFF; font-family: inherit; font-size: 15px; display: flex; justify-content: space-between; align-items: center; padding: 0 14px"><span style="color: #A1A1A6">Uhrzeit</span>16:00</button>
</div>
<div style="margin-top: 6px; font-size: 12px; color: #8E8E93">Automatisch = FOKUS sucht einen freien Platz in deiner Arbeitszeit.</div>

<div style="margin-top: 18px; font-size: 13px; color: #A1A1A6">Wiederholen</div>
<div style="margin-top: 6px; display: flex; gap: 8px">
<button aria-pressed="false" style="height: 36px; border-radius: 18px; border: none; background: #1C1C1F; color: #FFFFFF; font-family: inherit; font-size: 14px; padding: 0 12px">Nie</button>
<button aria-pressed="false" style="height: 36px; border-radius: 18px; border: none; background: #1C1C1F; color: #FFFFFF; font-family: inherit; font-size: 14px; padding: 0 12px">Täglich</button>
<button aria-pressed="false" style="height: 36px; border-radius: 18px; border: none; background: #1C1C1F; color: #FFFFFF; font-family: inherit; font-size: 14px; padding: 0 12px">Werktags</button>
<button aria-pressed="true" style="height: 36px; border-radius: 18px; border: none; background: #FFFFFF; color: #000000; font-family: inherit; font-size: 14px; font-weight: 500; padding: 0 12px">Wöchentlich</button>
</div>
<div style="margin-top: 8px; display: flex; justify-content: space-between">
<button aria-pressed="true" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: #2F8FD6; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600">Mo</button>
<button aria-pressed="false" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: #1C1C1F; color: #A1A1A6; font-family: inherit; font-size: 13px">Di</button>
<button aria-pressed="false" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: #1C1C1F; color: #A1A1A6; font-family: inherit; font-size: 13px">Mi</button>
<button aria-pressed="false" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: #1C1C1F; color: #A1A1A6; font-family: inherit; font-size: 13px">Do</button>
<button aria-pressed="false" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: #1C1C1F; color: #A1A1A6; font-family: inherit; font-size: 13px">Fr</button>
<button aria-pressed="false" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: #1C1C1F; color: #A1A1A6; font-family: inherit; font-size: 13px">Sa</button>
<button aria-pressed="false" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: #1C1C1F; color: #A1A1A6; font-family: inherit; font-size: 13px">So</button>
</div>

<a href="2-aufgaben.html" style="margin-top: auto; margin-bottom: 34px; height: 56px; border-radius: 28px; background: #FFFFFF; color: #000000; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Aufgabe anlegen</a>

</div>
</div>
</body>
</html>
